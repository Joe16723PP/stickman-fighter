<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stickman Fighter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="rotate">Rotate your phone</div>
<div id="stage">
<canvas id="game" width="960" height="540"></canvas>
<div id="controls">
<div class="pad p1">
<button data-p="0" data-k="jump" class="jump">Jump</button>
<div class="move">
<button data-p="0" data-k="left">◀</button>
<button data-p="0" data-k="right">▶</button>
</div>
<div class="actions"><button disabled>P</button><button disabled>K</button><button disabled>B</button><button disabled>S</button></div>
</div>
<div class="pad p2">
<button data-p="1" data-k="jump" class="jump">Jump</button>
<div class="move">
<button data-p="1" data-k="left">◀</button>
<button data-p="1" data-k="right">▶</button>
</div>
<div class="actions"><button disabled>P</button><button disabled>K</button><button disabled>B</button><button disabled>S</button></div>
</div>
</div>
</div>
<script src="game.js"></script>
</body>
</html>
