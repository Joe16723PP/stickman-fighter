<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stickman Fighter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="rotate">Rotate your phone</div>
<div id="stage">
<canvas id="game" width="960" height="540"></canvas>
<div id="controls">
<div class="pad left">
<div class="move">
<button data-p="0" data-k="left">◀</button>
<button data-p="0" data-k="right">▶</button>
</div>
</div>
<div class="pad right">
<div class="diamond">
<button data-p="0" data-k="jump" class="jump">Jump</button>
<button data-p="0" data-k="punch" class="punch" disabled>P</button>
<button data-p="0" data-k="kick" class="kick" disabled>K</button>
<button data-p="0" data-k="block" class="block" disabled>B</button>
<button data-p="0" data-k="special" class="special" disabled>S</button>
</div>
</div>
</div>
</div>
<script src="game.js"></script>
</body>
</html>
