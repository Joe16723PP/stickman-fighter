<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stickman Fighter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="rotate">Rotate your phone</div>
<div id="stage">
<canvas id="game" width="960" height="540"></canvas>
<div id="controls">
<div class="pad left">
<div id="move-stick" class="move-stick" aria-label="Move horizontally and change lane depth vertically">
<div class="stick-ring"><div class="stick-knob"></div></div>
</div>
</div>
<div class="pad right">
<div class="actions">
<button data-p="0" data-k="jump" class="jump">JUMP</button>
<div class="cluster">
<button data-p="0" data-k="punch" class="punch" aria-label="Normal attack">NORMAL</button>
<button data-p="0" data-k="kick" class="kick" aria-label="Heavy attack">HEAVY</button>
<button data-p="0" data-k="block" class="block">GUARD</button>
<button data-p="0" data-k="roll" class="roll" aria-label="Dodge roll (Shift)">ROLL</button>
<button data-p="0" data-k="special" class="special">SUPER</button>
</div>
</div>
</div>
</div>
<button id="main-menu-button" type="button" aria-label="Return to main menu">MAIN MENU</button>
<button id="practice-reset" type="button" aria-label="Reset training dummy">RESET DUMMY</button>
</div>
<script src="game.js"></script>
</body>
</html>
