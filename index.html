<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stickman Fighter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="rotate">Rotate your phone</div>
<div id="stage">
<canvas id="game" width="960" height="540"></canvas>
<div id="controls">
<div class="pad left">
<div id="move-stick" class="move-stick" aria-label="Move horizontally and change lane depth vertically">
<div class="stick-ring"><div class="stick-knob"></div></div>
</div>
</div>
<div class="pad right">
<div class="actions">
<button data-p="0" data-k="jump" class="jump" aria-label="Jump" title="Jump">
<svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3 4.5 10.5h4V21h7V10.5h4L12 3Z" fill="currentColor"/></svg>
</button>
<div class="cluster">
<button data-p="0" data-k="punch" class="punch" aria-label="Normal attack" title="Normal attack">
<svg class="ui-icon fist-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12V9.5A1.5 1.5 0 0 1 7 9v1-3a1.5 1.5 0 0 1 3 0v3-4a1.5 1.5 0 0 1 3 0v4-3a1.5 1.5 0 0 1 3 0v4h2a2 2 0 0 1 2 2v3a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5v-2l-1-2Z" fill="currentColor"/><path d="M7 13h9M10 10v3m3-3v3" fill="none" stroke="#10264a" stroke-width="1.4" stroke-linecap="square"/></svg>
</button>
<button data-p="0" data-k="kick" class="kick" aria-label="Heavy attack" title="Heavy attack">
<svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m12 1 2.2 6.1L21 4l-2.3 6.1L24 13l-6.6 1.4L19 21l-6-2.9L9 24l-.8-7L1 18l4.1-5.6L0 8l7 .2L8 1l4 5.1L12 1Z" fill="currentColor"/><path d="m13 7-4 6h3l-1 5 5-7h-3l1-4Z" fill="#74301f"/></svg>
</button>
<button data-p="0" data-k="block" class="block" aria-label="Guard" title="Guard">
<svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2 20 5v6c0 5-3.2 8.7-8 11-4.8-2.3-8-6-8-11V5l8-3Z" fill="currentColor"/><path d="m8.5 11.5 2.3 2.3 4.8-5" fill="none" stroke="#172338" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/></svg>
</button>
<button data-p="0" data-k="roll" class="roll" aria-label="Dodge roll (Shift)" title="Dodge roll">
<svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 10a8 8 0 0 1 14-4l2 2M20 8V3h-5M20 14a8 8 0 0 1-14 4l-2-2M4 16v5h5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter"/></svg>
</button>
<button data-p="0" data-k="special" class="special" aria-label="Special attack" title="Special attack">
<svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="m12 5 1.8 4.6 4.8.3-3.7 3 1.2 4.6-4.1-2.5-4.1 2.5 1.2-4.6-3.7-3 4.8-.3L12 5Z" fill="currentColor"/><path d="M12 1v2m11 9h-2M12 23v-2M1 12h2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
</button>
</div>
</div>
</div>
</div>
<button id="main-menu-button" type="button" aria-label="Game actions" aria-haspopup="menu" aria-expanded="false" title="Pause or main menu">
<svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/></svg>
</button>
<div id="game-action-menu" role="menu" aria-label="Game actions" hidden>
<button id="pause-game-button" type="button" role="menuitem">Ⅱ <span>PAUSE</span></button>
<button id="return-main-menu-button" type="button" role="menuitem">⌂ <span>MAIN MENU</span></button>
</div>
<button id="practice-reset" type="button" aria-label="Reset training dummy" title="Reset dummy">
<svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 8V3m0 0h5M4 3l4 4a8 8 0 1 1-2 9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter"/><path d="M12 8v5l3 2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/></svg>
</button>
</div>
<script src="stage-settings.js"></script>
<script src="game.js"></script>
</body>
</html>
